name: CI Base Trusted

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da base protegida
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validar contrato base-trusted
        shell: bash
        run: |
          ruby .github/scripts/check-ci-base-trusted-workflow.rb

      - name: Executar mutações base-trusted
        shell: bash
        run: |
          python3 .github/scripts/test-ci-base-trusted.py

      - name: Validar conteúdo não confiável
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/scripts/ci-base-trusted.sh
